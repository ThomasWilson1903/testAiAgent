<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Форма сбора данных</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: radial-gradient(circle at center, #2c3e50 0%, #000000 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            position: relative;
        }

        /* Стили для холста с анимацией */
        #bgCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none; /* Чтобы холст не мешал кликать по кнопкам */
        }

        .container {
            position: relative;
            z-index: 10; /* Форма всегда поверх холста */
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.8);
            width: 100%;
            max-width: 400px;
        }

        /* Стили для карточки предпросмотра */
        .preview-card {
            position: relative;
            z-index: 10;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.8);
            width: 100%;
            max-width: 400px;
            display: none; /* Скрыта по умолчанию */
        }

        h2 {
            text-align: center;
            color: #ffffff;
            margin-bottom: 30px;
            letter-spacing: 1px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #e0e0e0;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 8px;
            box-sizing: border-box;
            background: rgba(255, 255, 255, 0.05);
            color: white;
            outline: none;
            transition: border 0.3s ease;
        }

        input:focus, select:focus {
            border: 1px solid rgba(255, 255, 255, 0.6);
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(45deg, #28a745, #218838);
            border: none;
            color: white;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.3s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(40, 167, 69, 0.4);
        }

        .preview-item {
            margin-bottom: 15px;
            color: #e0e0e0;
        }

        .preview-item span {
            font-weight: bold;
            color: #fff;
        }

        .edit-btn {
            background: linear-gradient(45deg, #6c757d, #5a6268);
            margin-top: 10px;
        }
    </style>
</head>
<body>

<canvas id="bgCanvas"></canvas>

<!-- Основная форма -->
<div id="formContainer" class="container">
    <h2>Регистрация</h2>
    <form id="userForm">
        <div class="form-group">
            <label for="name">Имя:</label>
            <input type="text" id="name" name="name" placeholder="Введите ваше имя" required>
        </div>
        <div class="form-group">
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="example@mail.com" required>
        </div>
        <div class="form-group">
            <label for="role">Роль:</label>
            <select id="role" name="role" required>
                <option value="" disabled selected>Выберите вашу роль</option>
                <option value="Разработчик">Разработчик</option>
                <option value="Дизайнер">Дизайнер</option>
                <option value="Менеджер">Менеджер</option>
                <option value="Другое">Другое</option>
            </select>
        </div>
        <button type="submit">Отправить</button>
    </form>
</div>

<!-- Карточка предпросмотра -->
<div id="previewContainer" class="preview-card">
    <h2>Предпросмотр</h2>
    <div class="preview-item">Имя: <span id="viewName"></span></div>
    <div class="preview-item">Email: <span id="viewEmail"></span></div>
    <div class="preview-item">Роль: <span id="viewRole"></span></div>
    <button id="editBtn" class="edit-btn">Редактировать</button>
</div>

<script>
    /** --- Логика Canvas анимации --- **/
    const canvas = document.getElementById('bgCanvas');
    const ctx = canvas.getContext('2d');
    let particles = [];
    let mouse = { x: -1000, y: -1000 };

    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        initParticles();
    }

    window.addEventListener('resize', resize);
    window.addEventListener('mousemove', (e) => {
        mouse.x = e.clientX;
        mouse.y = e.clientY;
    });

    class Particle {
        constructor() {
            this.x = Math.random() * canvas.width;
            this.y = Math.random() * canvas.height;
            this.radius = Math.random() * 40 + 10;
            this.color = `rgba(${Math.random() * 150 + 100}, ${Math.random() * 255}, ${Math.random() * 255}, ${Math.random() * 0.3 + 0.1})`;
            this.vx = (Math.random() - 0.5) * 2;
            this.vy = (Math.random() - 0.5) * 2;
        }

        update() {
            this.x += this.vx;
            this.y += this.vy;

            if (this.x < this.radius) this.x = this.radius;
            if (this.x > canvas.width - this.radius) this.x = canvas.width - this.radius;
            if (this.y < this.radius) this.y = this.radius;
            if (this.y > canvas.height - this.radius) this.y = canvas.height - this.radius;

            const dx = mouse.x - this.x;
            const dy = mouse.y - this.y;
            const distance = Math.sqrt(dx * dx + dy * dy);
            
            if (distance < 200) {
                const force = (200 - distance) / 200;
                this.x -= dx * force * 0.1;
                this.y -= dy * force * 0.1;
            }
        }

        draw() {
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
            ctx.fillStyle = this.color;
            ctx.fill();
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
            ctx.stroke();
        }
    }

    function initParticles() {
        particles = [];
        const count = Math.floor((canvas.width * canvas.height) / 10000);
        for (let i = 0; i < count || i < 30; i++) {
            particles.push(new Particle());
        }
    }

    function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        particles.forEach(p => {
            p.update();
            p.draw();
        });
        requestAnimationFrame(animate);
    }

    resize();
    animate();

    /** --- Логика формы и переключения экранов --- **/
    const formContainer = document.getElementById('formContainer');
    const previewContainer = document.getElementById('previewContainer');
    const userForm = document.getElementById('userForm');
    const editBtn = document.getElementById('editBtn');

    // Элементы предпросмотра
    const viewName = document.getElementById('viewName');
    const viewEmail = document.getElementById('viewEmail');
    const viewRole = document.getElementById('viewRole');

    userForm.addEventListener('submit', function(event) {
        event.preventDefault();
        
        const name = document.getElementById('name').value.trim();
        const email = document.getElementById('email').value.trim();
        const role = document.getElementById('role').value;

        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

        if (name.length < 2) {
            alert('Ошибка: Имя должно содержать минимум 2 символа.');
            return;
        }

        if (!emailRegex.test(email)) {
            alert('Ошибка: Введен неверный формат Email.');
            return;
        }

        if (!role) {
            alert('Ошибка: Пожалуйста, выберите роль.');
            return;
        }

        // Если валидация пройдена — переключаем экраны
        viewName.textContent = name;
        viewEmail.textContent = email;
        viewRole.textContent = role;

        formContainer.style.display = 'none';
        previewContainer.style.display = 'block';
    });

    editBtn.addEventListener('click', function() {
        // Возвращаем форму и скрываем предпросмотр
        previewContainer.style.display = 'none';
        formContainer.style.display = 'block';
        
        // Очищаем поля формы
        userForm.reset();
    });
</script>

</body>
</html>
