<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Форма сбора данных</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: radial-gradient(circle at center, #2c3e50 0%, #000000 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden; /* Чтобы анимации не создавали прокрутку */
            position: relative;
        }

        /* Стили для анимированных пузырьков на фоне */
        .bubble {
            position: absolute;
            bottom: -100px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.2);
            animation: floatUp 15s infinite ease-in-out;
            z-index: 0;
        }

        .bubble:nth-child(1) { width: 80px; height: 80px; left: 10%; animation-duration: 12s; }
        .bubble:nth-child(2) { width: 120px; height: 120px; left: 25%; animation-duration: 18s; background: rgba(44, 167, 69, 0.2); }
        .bubble:nth-child(3) { width: 50px; height: 50px; left: 40%; animation-duration: 10s; }
        .bubble:nth-child(4) { width: 100px; height: 100px; left: 65%; animation-duration: 20s; background: rgba(0, 123, 255, 0.2); }
        .bubble:nth-child(5) { width: 60px; height: 60px; left: 85%; animation-duration: 14s; }

        @keyframes floatUp {
            0% { transform: translateY(0) rotate(0deg); opacity: 0; }
            50% { opacity: 0.6; }
            100% { transform: translateY(-100vh) rotate(360deg); opacity: 0; }
        }

        .container {
            position: relative;
            z-index: 10; /* Чтобы форма была поверх пузырьков */
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.8);
            width: 100%;
            max-width: 400px;
        }
        h2 {
            text-align: center;
            color: #ffffff;
            margin-bottom: 30px;
            letter-spacing: 1px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #e0e0e0;
        }
        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 8px;
            box-sizing: border-box;
            background: rgba(255, 255, 255, 0.05);
            color: white;
            outline: none;
            transition: border 0.3s ease;
        }
        input:focus, select:focus {
            border: 1px solid rgba(255, 255, 255, 0.6);
        }
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(45deg, #28a745, #218838);
            border: none;
            color: white;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.3s;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(40, 167, 69, 0.4);
        }
    </style>
</head>
<body>

<div class="bubble"></div>
<div class="bubble"></div>
<div class="bubble"></div>
<div class="bubble"></div>
<div class="bubble"></div>

<div class="container">
    <h2>Регистрация</h2>
    <form id="userForm">
        <div class="form-group">
            <label for="name">Имя:</label>
            <input type="text" id="name" name="name" placeholder="Введите ваше имя" required>
        </div>
        <div class="form-group">
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="example@mail.com" required>
        </div>
        <div class="form-group">
            <label for="role">Роль:</label>
            <select id="role" name="role" required>
                <option value="" disabled selected>Выберите вашу роль</option>
                <option value="Разработчик">Разработчик</option>
                <option value="Дизайнер">Дизайнер</option>
                <option value="Менеджер">Менеджер</option>
                <option value="Другое">Другое</option>
            </select>
        </div>
        <button type="submit">Отправить</button>
    </form>
</div>

<script>
    document.getElementById('userForm').addEventListener('submit', function(event) {
        event.preventDefault();
        
        const name = document.getElementById('name').value.trim();
        const email = document.getElementById('email').value.trim();
        const role = document.getElementById('role').value;

        // Регулярное выражение для проверки Email
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

        // Валидация
        if (name.length < 2) {
            alert('Ошибка: Имя должно содержать минимум 2 символа.');
            return;
        }

        if (!emailRegex.test(email)) {
            alert('Ошибка: Введен неверный формат Email.');
            return;
        }

        if (!role) {
            alert('Ошибка: Пожалуйста, выберите роль.');
            return;
        }

        // Если все проверки пройдены
        alert(`Привет, ${name}! Ваша роль: ${role}. Мы получили данные по адресу: ${email}`);
    });
</script>

</body>
</html>
